packages:
  - '*'

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - better-sqlite3
  - sharp

# pnpm 11+ ignores .npmrc settings; the site imports hoisted transitive deps (scule, ufo, @vueuse/core, minimark).
shamefullyHoist: true

# pnpm 11+ reads build approvals from here; the two lists above are the pnpm 10 form.
allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.141'
  - '@iconify-json/vscode-icons@1.2.86'

# mdast-util-to-markdown 2.2.0 overflows the stack under remark-mdc 3.11.1's strong handler,
# which breaks /llms-full.txt. Drop this once remark-mdc handles it.
overrides:
  mdast-util-to-markdown: 2.1.2
