hero:
  title: 'Unleash your server development.'
  description: A TypeScript server framework with decorators and dependency injection, as fast as a bare router. Runs on Node.js, Bun and Deno.
  slug: 'runs on Node.js, Bun & Deno'
  tabs:
    - title: Routing
      file: src/Controllers/UserController.ts
      content: |
        ```ts
        import { Controller, Get, Post, Body } from '@vercube/core';

        @Controller('/users')
        export class UserController {
          @Get('/')
          async list() {
            return [{ id: 1, name: 'Ada' }];
          }

          @Post('/')
          async create(@Body() data: { name: string }) {
            return { id: 2, ...data };
          }
        }
        ```
    - title: Dependency Injection
      file: src/Services/UserService.ts
      content: |
        ```ts
        import { Inject } from '@vercube/di';
        import { Database } from '@/Services/Database';
        import { Logger } from '@/Services/Logger';

        export class UserService {
          @Inject(Database)
          private readonly db!: Database;

          @Inject(Logger)
          private readonly logger!: Logger;

          async findAll() {
            this.logger.info('Fetching users');
            return this.db.query('SELECT * FROM users');
          }
        }
        ```
    - title: Typed client
      file: web/src/api.ts
      content: |
        ```ts
        import { createClient } from '@vercube/client';
        import type { VercubeRoutes } from '../.vercube/routes.js';

        const api = createClient<VercubeRoutes>({ baseURL: '/api' });

        const user = await api.get('/users/:id', { params: { id: '42' } });
        //    ^? { id: string; name: string; createdAt: string }

        await api.post('/users', { body: { name: 'Ada' } });
        ```
    - title: Serverless
      file: src/index.ts
      content: |
        ```ts
        import { createApp } from '@vercube/core';
        import { toServerlessHandler } from '@vercube/serverless/aws-lambda';
        import type { ServerlessHandler } from '@vercube/serverless';

        const app = await createApp();

        export const handler: ServerlessHandler = toServerlessHandler(app);
        ```
